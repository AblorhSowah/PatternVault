[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patternvault"
version = "0.1.0"
description = "Local-first AI development intelligence: learns from AI coding assistants and reuses verified patterns offline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36,<2.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "watchfiles>=0.24",
  "tree-sitter>=0.23",
  # Grammars are bundled in each wheel (works offline). tree-sitter-language-pack was rejected: it downloads
  # parsers from the network on first use.
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-php>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-ruby>=0.23",
  "tree-sitter-rust>=0.23",
  "tree-sitter-c-sharp>=0.23",
  "cryptography>=43",
  "numpy>=1.26",
  "pathspec>=0.12",
  "psutil>=7.2.2",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.7",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "playwright>=1.48",
]

[project.scripts]
patternvault-backend = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["database/migrations/*.mako", "database/migrations/versions/*.py", "generation/model_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: fast isolated tests",
  "integration: tests using real SQLite/git/FastAPI",
  "e2e: browser/extension end-to-end tests",
  "live: needs a real external service (e.g. a real Ollama); opt-in via environment variables",
  "security: security-focused tests",
  "regression: regression guard tests",
  "performance: performance budget tests",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend", "tests"]
extend-exclude = ["backend/app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests (and used for invariants)
  "B008",   # FastAPI Depends() in defaults
  "RUF012", # mutable class attrs on pydantic/sqlalchemy models
  "S603", "S607", # subprocess is a core feature, gated by security/permissions.py
  "E501",   # long prose/regex lines: the formatter handles code; chasing message strings adds noise
  "RUF001", "RUF002", # typographic symbols (×, …, →) are intentional in user-facing text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S608", "E501", "RUF059", "S105", "S106", "S108", "S311", "S104", "S110", "SIM300"]
"backend/app/security/permissions.py" = ["E501"]  # regex/command tables
"backend/app/security/secrets.py" = ["E501"]
"backend/app/security/exclusions.py" = ["E501"]
"backend/app/security/untrusted.py" = ["E501", "RUF001"]
"backend/app/extraction/categorizer.py" = ["E501", "RUF001"]  # rule tables
"backend/app/extraction/language.py" = ["E501"]
"backend/app/knowledge/fts.py" = ["E501"]
"backend/app/retrieval/*.py" = ["E501"]
"backend/app/knowledge/*.py" = ["E501"]
"backend/app/extraction/extractor.py" = ["E501"]
"backend/app/extraction/structure.py" = ["E501"]
"backend/app/learning/adapters/claude_code.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["backend/app"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules", "vscode-extension"]
# B101 assert (tests/invariants); B404/B603: subprocess is a core feature - argv lists only, never shell=True,
# and every agent-driven command passes security/permissions.py first.
skips = ["B101", "B404", "B603"]

[tool.coverage.run]
source = ["backend/app"]
branch = true
